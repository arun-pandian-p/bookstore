<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booksy</title>
    <link rel="stylesheet" href="/booksky/style.css">
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&display=swap" rel="stylesheet">
    
</head>
<body>
    <div class="navbar">
        <h1>bookStore</h1>
    </div>
    <div class="container">
        <div class="book-container">
            <h2>Rich Dad Poor Dad</h2>
            <h5>Robert</h5>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Consequatur aliquam non officiis? Iure ad, libero laboriosam doloremque quod necessitatibus quisquam.</p>
            <button>delete</button>
        </div>
        
    </div>
    <div class="popup-overlay">
        <div class="popup-box">
            <h2>Add Book</h2>
            <form action="">
                <input type="text"placeholder="Book Title" id="book-title-input">
                <input type="text"placeholder="Book Author" id="book-author-input">
                <textarea name=""placeholder="Short Description" id="book-description-input"></textarea>
                <button id="add-book">Add</button>
                <button id="cencel-book">CANCEL</button>
            </form>
        </div>
    </div>
    <button class="add-button" id="popupbutton">+</button>
    <script src="/booksky/script.js"></script>
</body>
</html>
